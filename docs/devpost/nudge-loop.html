<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nudge — the connection loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FBF8F4; --ink: #1F2330; --accent: #6052BD; --accent-tint: rgba(96,82,189,0.10);
      --muted: #5B6172; --soft: #7C8291;
      --sans: 'Geist', sans-serif; --mono: 'Geist Mono', monospace; --serif: 'Instrument Serif', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    header { width: 100%; max-width: 1040px; }
    .eyebrow { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    h1 { font: 400 30px var(--serif); margin-top: 6px; }
    h1 em { font-style: italic; color: var(--accent); }
    .diagram { width: 100%; max-width: 1040px; }
    svg { width: 100%; height: auto; display: block; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .hub { fill: var(--ink); }
    .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--accent); }
    .sublabel { fill: var(--muted); font: 400 8px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Nudge · why it compounds</div>
    <h1>Every call makes the <em>next one</em> easier to start</h1>
  </header>
  <div class="diagram">
    <svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
      <title id="loop-title">The Nudge connection loop</title>
      <desc id="loop-desc">Six stations flow clockwise: both calendars free, a nudge on both phones, the call itself, photos surfacing from what you say, a summary written after the call, and a follow-up that seeds the next nudge. Each station writes into one central call-memory hub, with the call highlighted as the human moment everything else serves.</desc>
      <defs>
        <pattern id="loop-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(31,35,48,0.10)"/></pattern>
        <marker id="loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5B6172"/></marker>
        <marker id="loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7C8291"/></marker>
      </defs>
      <rect width="1040" height="680" fill="#FBF8F4"/>
      <rect width="1040" height="680" fill="url(#loop-dots)" opacity="0.55"/>

      <!-- Clockwise ring, r=240 -->
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#loop-arrow)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#loop-arrow)"/>

      <!-- Dashed write-backs into the hub -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M672 252 L616 284" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M672 428 L616 396" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M520 548 V400" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#loop-arrow-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#loop-arrow-soft)"/>

      <rect x="532" y="200" width="60" height="16" rx="4" fill="#FBF8F4"/>
      <text x="562" y="212" class="arrow-label">FREE WINDOW</text>
      <rect x="446" y="464" width="80" height="16" rx="4" fill="#FBF8F4"/>
      <text x="486" y="476" class="arrow-label">TOPICS · TODOS</text>

      <!-- Stations -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name">Both free</text><text x="520" y="116" class="sublabel">free/busy overlap only</text>

      <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name">Nudge</text><text x="728" y="236" class="sublabel">both phones · accept or skip</text>

      <rect class="station focal" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name focal-name">The call</text><text x="728" y="476" class="sublabel">1:1 video · the real moment</text>

      <rect class="station" x="440" y="548" width="160" height="64" rx="6"/>
      <text x="520" y="576" class="node-name">Photos surface</text><text x="520" y="596" class="sublabel">say it · see it · share it</text>

      <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
      <text x="312" y="456" class="node-name">Summary</text><text x="312" y="476" class="sublabel">what you talked about</text>

      <rect class="station" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name">Follow-up</text><text x="312" y="236" class="sublabel">"ask how the exam went"</text>

      <!-- Hub -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Call memory</text>
      <text x="520" y="360" class="hub-sub">per friendship · yours to delete</text>
    </svg>
  </div>
</body>
</html>
